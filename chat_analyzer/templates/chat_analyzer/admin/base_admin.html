<!-- admin base block -->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}Welcome Page{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  {% load heroicons %}

  <!-- custom css use when needed -->
  {% block extra_css %}{% endblock %}

  <!-- current css setup on this file -->
  <style>
  </style>

</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- here we will include our side-bar -->
        {% include "chat_analyzer/admin/partials/admin_sidebar.html" %}

        <!-- main content here -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- include our header -->
            {% include "chat_analyzer/admin/partials/admin_header.html" %}

            <main class="flex-1 overflow-y-auto p-4 md:p-6">
                {% block content %}
                {% endblock %}
            </main>
        </div>
    </div>
    
</body>


</html>
